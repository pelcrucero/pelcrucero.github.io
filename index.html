<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Parral 2025</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Peña El Crucero">
    <meta name="theme-color" content="#1e3d59">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" type="image/x-icon" href="logo2.png" />
</head>
<body>
    <div class="container">
        <div class="branding">
            <img src="logo2.png" alt="Logo" class="logo">
            <h2>Peña El Crucero</h2>
            <img src="logo2.png" alt="Logo" class="logo" id="logo-admin-trigger">
        </div>
        <div class="tabs">
            <button class="tab-link tab-link-comida tab-selected" onclick="openTab('comida')">COMIDA</button>
            <button class="tab-link tab-link-bebida" onclick="openTab('bebida')">BEBIDA</button>
        </div>
        <div id="comida" class="tab-content"></div>
        <div id="bebida" class="tab-content" style="display: none;"></div>
        <div class="payment-section">
            <div class="payment-info">
                <div class="payment-label total-amount" style="color: #d9534f;">Total</div>
                <div class="payment-amount total-amount" style="color: #d9534f;" id="total-amount">0.00€</div>
            </div>
            <div class="payment-info">
                <div class="payment-label payment-amount" style="color: #1e3d59;">Pago</div>
                <input type="number" class="payment-input payment-amount" style="color: #1e3d59;" id="payment-input" oninput="calculateChange()" pattern="[0-9]*">
            </div>
            <div class="payment-info">
                <div class="payment-label change-amount" style="color: #5cb85c;">Vueltas</div>
                <div class="payment-amount change-amount" id="change-amount">0.00€</div>
            </div>
            <button id="reset-button" onclick="resetQuantities()">Borrar</button>
        </div>
    </div>

    <div id="admin-overlay">
        <div id="admin-login">
            <h3>Administración</h3>
            <div class="admin-form-group">
                <label>Usuario</label>
                <input type="text" id="admin-user" placeholder="Usuario" autocomplete="off">
            </div>
            <div class="admin-form-group">
                <label>Contraseña</label>
                <input type="password" id="admin-pass" placeholder="Contraseña">
            </div>
            <div id="admin-error"></div>
            <button class="admin-btn-primary" onclick="adminLogin()">Entrar</button>
        </div>
        <div id="admin-panel">
            <div class="admin-token-bar">
                <label for="admin-gh-token">Token GitHub</label>
                <input type="password" id="admin-gh-token" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
            </div>
            <div class="admin-toolbar">
                <button class="admin-btn-secondary" onclick="adminAddItem()">+ Añadir</button>
                <div class="admin-toolbar-right">
                    <button class="admin-btn-primary" onclick="adminSave()">Guardar cambios</button>
                    <button class="admin-btn-back" onclick="adminClose()">Volver</button>
                </div>
            </div>
            <div class="admin-table-wrapper">
                <table id="admin-table">
                    <thead>
                        <tr>
                            <th>Orden</th>
                            <th>Nombre</th>
                            <th>Precio (€)</th>
                            <th>Categoría</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
